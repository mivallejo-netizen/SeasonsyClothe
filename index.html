<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b8def">
<title>ENGLISH ADVENTURE – Seasons & Clothes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#26324a; --muted:#5d6b85; --en:#1864ab; --es:#7048e8; --ok:#2fb344; --bad:#fa5252;
  --accent:#5b8def; --accent-d:#3a63c9; --theme-bg:#eef3ff; --soft:#dbe4ff;
  --shadow:0 6px 0 rgba(30,50,100,.10), 0 12px 26px rgba(30,50,100,.10);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Baloo 2','Nunito','Comic Sans MS','Chalkboard SE',system-ui,sans-serif;color:var(--ink);
  background-color:var(--theme-bg);background-image:radial-gradient(rgba(255,255,255,.75) 2px,transparent 2.6px);background-size:26px 26px;
  min-height:100vh;transition:background-color .4s;line-height:1.25}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;border:none;background:none}
#app{max-width:1040px;margin:0 auto;padding:10px 16px 100px}
.en{color:var(--en);font-weight:800}
.es{color:var(--es);font-weight:700}
h1,h2,h3,p{margin:0}

/* ---------- top bar & buttons ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:8px 0 10px;
  background:linear-gradient(var(--theme-bg) 75%,rgba(0,0,0,0))}
.topbar .ttl{font-size:clamp(1.15rem,4.5vw,1.6rem);font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round{width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:0 4px 0 #cfd8ea;font-size:1.6rem;display:grid;place-items:center;flex:0 0 56px}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 #cfd8ea}
#sfxbtn{position:fixed;right:14px;bottom:14px;z-index:60}
.btn{font-weight:800;font-size:1.15rem;border-radius:18px;padding:12px 20px;min-height:58px;background:var(--accent);color:#fff;
  box-shadow:0 5px 0 var(--accent-d);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-d)}
.btn.alt{background:#20c997;box-shadow:0 5px 0 #0f9f77}
.btn.es{background:#9775fa;box-shadow:0 5px 0 #7048e8}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #cfd8ea}
.btn.warm{background:#ff922b;box-shadow:0 5px 0 #e8590c}
.btnrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:14px 0}
.instr{background:#fff;border-radius:16px;padding:10px 14px;font-size:1.1rem;font-weight:700;margin:6px auto 14px;max-width:720px;text-align:center;box-shadow:0 3px 0 #dde4f2}
.note{font-size:.95rem;color:var(--muted);margin-top:10px}

/* ---------- home ---------- */
.home-hero{text-align:center;padding:14px 0 4px}
.home-hero h1{font-size:clamp(2.1rem,8.5vw,3.8rem);line-height:1;font-weight:800;letter-spacing:1px}
.home-hero h1 .t1{color:#ff6b6b;text-shadow:0 4px 0 #c92a2a}
.home-hero h1 .t2{color:#4c6ef5;text-shadow:0 4px 0 #364fc7}
.home-hero .sub{font-size:clamp(1.3rem,5vw,1.9rem);font-weight:800;color:#2b8a3e;margin-top:6px}
.season-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin:8px 0 18px}
.scard{position:relative;overflow:hidden;border-radius:28px;padding:14px 16px 16px;color:#fff;text-align:left;min-height:210px;
  display:flex;flex-direction:column;justify-content:flex-end;transition:transform .15s}
.scard:active{transform:scale(.97)}
.scard.winter{background:linear-gradient(160deg,#74c0fc,#1c7ed6);box-shadow:0 8px 0 #1864ab}
.scard.fall{background:linear-gradient(160deg,#ffc078,#e8590c);box-shadow:0 8px 0 #c2410c}
.scard.spring{background:linear-gradient(160deg,#8ce99a,#2f9e44);box-shadow:0 8px 0 #2b8a3e}
.scard.summer{background:linear-gradient(160deg,#ffe066,#f76707);box-shadow:0 8px 0 #d9480f}
.scard .en,.bin .en,.shero .en{color:#fff}
.sart{position:absolute;inset:0 0 auto 0;height:130px}
.sart span{position:absolute;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15));animation:floaty 3.4s ease-in-out infinite}
.sart .a0{font-size:78px;left:50%;top:14px;margin-left:-39px}
.sart .a1{font-size:40px;right:12px;top:10px;animation-delay:-1s}
.sart .a2{font-size:34px;left:10px;top:12px;animation-delay:-2s}
.sname,.sprog{position:relative;z-index:1}
.sname b{display:block;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.sname span{font-size:1.15rem;font-weight:700;opacity:.95}
.sprog{display:flex;align-items:center;gap:8px;margin-top:8px}
.bar{flex:1;height:12px;border-radius:99px;background:rgba(255,255,255,.35);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:99px}
.nomedal{filter:grayscale(1);opacity:.55}
.sprog .md{font-size:1.6rem}
.home-actions{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bigbtn{display:flex;align-items:center;gap:12px;background:#fff;border-radius:24px;padding:14px 16px;box-shadow:var(--shadow);text-align:left;font-size:2.3rem;min-height:86px}
.bigbtn b{display:block;font-size:1.2rem;line-height:1.1}
.bigbtn small{display:block;font-size:.95rem;color:var(--muted);font-weight:700}
.bigbtn:active{transform:scale(.98)}
.foot{text-align:center;margin-top:20px}
.linkbtn{font-weight:800;color:var(--accent-d);font-size:1.05rem;padding:10px;text-decoration:underline}

/* ---------- guide owl ---------- */
.guide{display:flex;align-items:flex-end;gap:10px;margin:6px 0 14px;cursor:pointer}
.owl{width:82px;flex:0 0 82px;animation:bob 3s ease-in-out infinite}
.guide.hop .owl{animation:hop .6s ease}
.owlsvg .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.bubble{position:relative;flex:1;background:#fff;border-radius:22px;padding:12px 16px;font-size:1.12rem;font-weight:700;box-shadow:var(--shadow);margin-bottom:18px}
.bubble:before{content:"";position:absolute;left:-12px;bottom:16px;border:12px solid transparent;border-right-color:#fff;border-left:0}
.bubble .hint{display:block;font-size:.8rem;color:var(--muted);font-weight:600;margin-top:2px}

/* ---------- season screen ---------- */
.shero{border-radius:28px;padding:16px 18px;color:#fff;display:flex;align-items:center;gap:14px;box-shadow:0 7px 0 var(--accent-d);
  background:linear-gradient(140deg,var(--c1),var(--accent))}
.shero .big{font-size:3.4rem;line-height:1}
.shero h2{font-size:clamp(1.8rem,7vw,2.6rem);line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.shero p{font-size:1.15rem;font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 16px}
.tab{background:#fff;border-radius:18px;padding:8px 4px;font-weight:800;font-size:.95rem;box-shadow:0 4px 0 #cfd8ea;display:flex;flex-direction:column;align-items:center;min-height:74px;justify-content:center}
.tab span{font-size:1.7rem;line-height:1.1}
.tab.on{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-d)}
.sec{font-size:1.4rem;margin:14px 0 10px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
.wcard{position:relative;background:#fff;border-radius:22px;padding:10px 10px 12px;text-align:center;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s}
.wcard:active{transform:scale(.96)}
.wcard>.en{font-size:1.45rem;line-height:1.1}
.wcard>.es{font-size:1rem}
.snd{position:absolute;top:8px;right:8px;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;font-size:1.3rem;box-shadow:0 3px 0 var(--accent-d);display:grid;place-items:center}
.snd.big{position:static;width:64px;height:64px;font-size:1.8rem;flex:0 0 64px}
.check{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;background:var(--ok);color:#fff;font-style:normal;font-weight:800;display:grid;place-items:center}
.gamegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.gcard{background:#fff;border-radius:24px;padding:14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;text-align:left;min-height:96px}
.gcard .ge{font-size:2.6rem;width:66px;height:66px;flex:0 0 66px;border-radius:20px;background:var(--soft);display:grid;place-items:center}
.gcard b{display:block;font-size:1.15rem;line-height:1.1}
.gcard small{display:block;color:var(--muted);font-weight:600;font-size:.92rem}
.gcard .st{font-size:1rem;letter-spacing:1px}
.gcard:active{transform:scale(.98)}

/* ---------- art ---------- */
.art{position:relative;display:grid;place-items:center;width:100%;border-radius:50%;
  background:radial-gradient(circle closest-side,var(--soft) 0 97%,rgba(0,0,0,0) 98%)}
.art svg{position:absolute;left:4%;top:4%;width:92%;height:92%;overflow:visible}
.art.emoji span{line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.08))}
.art.sm{height:60px}.art.sm span{font-size:44px}
.art.md{height:100px}.art.md span{font-size:70px}
.art.lg{height:170px}.art.lg span{font-size:124px}
.art.xl{height:min(230px,32vh)}.art.xl span{font-size:min(165px,24vh)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:120;background:rgba(25,35,70,.45);display:grid;place-items:center;padding:14px;animation:fade .2s}
.mbox{position:relative;background:#fff;border-radius:28px;width:100%;max-width:580px;max-height:94vh;overflow:auto;padding:22px 18px;text-align:center;animation:pop .25s}
.mbox .x{position:absolute;top:10px;right:10px;width:48px;height:48px;border-radius:50%;background:#f1f3f5;font-size:1.3rem}
.bigword{font-size:clamp(2.5rem,10vw,4rem);line-height:1.05;margin-top:6px}
.bigtr{font-size:clamp(1.4rem,5vw,1.8rem);color:var(--es);font-weight:800}
.navrow{display:flex;justify-content:center;align-items:center;gap:18px;font-weight:800;font-size:1.1rem}
.parents{text-align:left}
.parents h3{margin:14px 0 4px;font-size:1.2rem}
.parents li{margin:4px 0}

/* ---------- games ---------- */
.gprog{display:flex;gap:8px;justify-content:center;margin:0 0 12px;flex-wrap:wrap}
.gprog i{width:16px;height:16px;border-radius:50%;background:#d6deec;display:block;transition:.2s}
.gprog i.done{background:var(--ok)}
.gprog i.now{background:var(--accent);transform:scale(1.35)}
.qcard{background:#fff;border-radius:28px;padding:16px;box-shadow:var(--shadow);text-align:center;max-width:680px;margin:0 auto}
.qword{display:flex;justify-content:center;align-items:center;gap:12px;font-size:clamp(2.2rem,9vw,3.2rem);margin:6px 0}
.ask{font-size:1.35rem;font-weight:800;margin:6px 0 10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.opt{min-height:70px;border-radius:20px;background:#f1f5ff;border:4px solid #dbe4ff;font-size:1.45rem;font-weight:800;padding:8px}
.opt.enopt{color:var(--en)}
.opt.right,.imgopt.right{background:#d3f9d8;border-color:var(--ok);animation:pop .35s}
.opt.wrong,.imgopt.wrong{background:#ffe3e3;border-color:#ffa8a8;opacity:.6;animation:shake .4s}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:760px;margin:0 auto}
.mcell{background:#fff;border-radius:22px;padding:10px;border:4px dashed #c5d0e6;text-align:center;transition:.15s}
.mcell.over{border-color:var(--accent);background:var(--soft);transform:scale(1.03)}
.mcell.matched{border-style:solid;border-color:var(--ok);background:#ebfbee}
.slot{min-height:44px;font-size:1.45rem;font-weight:800;color:#adb5bd;display:grid;place-items:center}
.mcell.matched .slot{color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:18px auto 0;max-width:760px}
.chip{background:var(--accent);color:#fff;font-size:1.5rem;font-weight:800;border-radius:999px;padding:10px 24px;min-height:60px;box-shadow:0 5px 0 var(--accent-d);touch-action:none;user-select:none;-webkit-user-select:none}
.chip.sel{outline:5px solid #ffd43b;outline-offset:2px}
.chip.dragging,.dragme.dragging{opacity:.3}
.ghost{opacity:.95;box-shadow:0 14px 28px rgba(0,0,0,.25)!important}
.shake{animation:shake .4s}
.sortitem{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:16px}
.dragme{background:#fff;border-radius:26px;padding:10px 14px 12px;width:210px;box-shadow:var(--shadow);text-align:center;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.dragme .en{font-size:1.7rem;display:block}
.bins{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:760px;margin:0 auto}
.bin{border-radius:24px;min-height:112px;color:#fff;border:5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.15s}
.bin .be{font-size:2.5rem;line-height:1}
.bin .en{font-size:1.5rem;line-height:1}
.bin small{font-weight:700;font-size:1rem}
.bin.winter{background:linear-gradient(160deg,#74c0fc,#1c7ed6)}
.bin.fall{background:linear-gradient(160deg,#ffc078,#e8590c)}
.bin.spring{background:linear-gradient(160deg,#8ce99a,#2f9e44)}
.bin.summer{background:linear-gradient(160deg,#ffe066,#f76707)}
.bin.over{transform:scale(1.06);border-color:#fff;box-shadow:0 0 0 5px var(--accent)}
.bin.yes{animation:pop .4s;border-color:#fff}
.spell{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px 0}
.box{width:clamp(38px,10vw,54px);height:clamp(50px,13vw,64px);border-radius:14px;background:#f1f5ff;border-bottom:5px solid #bac8ff;font-size:clamp(1.7rem,7vw,2.3rem);font-weight:800;display:grid;place-items:center;color:var(--en)}
.box.blank{background:#fff3bf;border:3px dashed #fcc419;border-bottom-width:5px;color:#e67700}
.box.cur{box-shadow:0 0 0 5px #ffd43b;animation:pulse 1.4s infinite}
.bigbtn.final{grid-column:1/-1;background:linear-gradient(135deg,#845ef7,#5c7cfa);color:#fff;box-shadow:0 7px 0 #4c3ab8}
.bigbtn.final small{color:#e5dbff}
.seasontag{font-size:1rem;letter-spacing:2px}
.skills{list-style:none;padding:0;margin:6px 0;display:grid;gap:8px}
.skills li{background:#fff4e6;border-radius:14px;padding:8px 12px;font-weight:800}
.box.filled{background:#d3f9d8;border:3px solid var(--ok);color:var(--ok);animation:pop .35s}
.sep{width:16px;font-size:2rem;font-weight:800;display:grid;place-items:center}
.letters{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.letter{width:76px;height:76px;border-radius:22px;background:var(--accent);color:#fff;font-size:2.4rem;font-weight:800;box-shadow:0 5px 0 var(--accent-d)}
.letter.wrong{background:#ffc9c9;box-shadow:0 5px 0 #ffa8a8;animation:shake .4s}
.listenbtn{display:flex;flex-direction:column;align-items:center;margin:4px auto 16px;width:150px;height:150px;border-radius:50%;background:var(--accent);color:#fff;font-size:3.4rem;justify-content:center;box-shadow:0 7px 0 var(--accent-d);animation:pulse 2s infinite}
.listenbtn span{font-size:.95rem;font-weight:800}
.imgopts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:720px;margin:0 auto}
.imgopt{background:#fff;border-radius:22px;border:4px solid #e4e9f5;padding:8px;box-shadow:var(--shadow)}
.imgopt .lbl{display:block;font-size:1.15rem;font-weight:800;color:var(--en);min-height:1.4em}
.result{background:#fff;border-radius:28px;padding:22px;text-align:center;box-shadow:var(--shadow);max-width:640px;margin:0 auto;animation:pop .35s}
.result h2{font-size:clamp(2rem,8vw,2.8rem)}
.rstars{font-size:3rem;letter-spacing:4px}
.medal{font-size:6rem;line-height:1;animation:bounce 1.4s infinite}
.review{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px;text-align:center}
.review .wcard{box-shadow:0 3px 0 #dde4f2;background:#f8f9ff}

/* ---------- quiz ---------- */
.qstars{display:flex;justify-content:center;gap:2px;font-size:1.5rem;margin-bottom:8px;flex-wrap:wrap}
.qstars i{font-style:normal;opacity:.3}
.qstars i.on{opacity:1;animation:pop .35s}
.qnum{font-weight:800;color:var(--muted);text-align:center}

/* ---------- builder ---------- */
.builder{display:grid;gap:14px}
.bside{display:flex;flex-direction:column;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.seg button{background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;font-size:1.05rem;box-shadow:0 3px 0 #cfd8ea;min-height:48px;border:3px solid transparent}
.seg button.on{border-color:var(--accent);background:var(--soft)}
.seg .sk{width:44px;height:44px;padding:0;border-radius:50%}
.scene{position:relative;height:min(420px,58vh);min-height:320px;border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}
.scene.winter{background:linear-gradient(#a5d8ff,#e7f5ff 72%,#fff 72%)}
.scene.fall{background:linear-gradient(#ffd8a8,#fff4e6 72%,#e8a87c 72%)}
.scene.spring{background:linear-gradient(#a5f3fc,#e6fcf5 72%,#8ce99a 72%)}
.scene.summer{background:linear-gradient(#74c0fc,#d0ebff 66%,#ffe58f 66%)}
.scene .deco span{position:absolute;top:-40px;font-size:28px;animation:drift linear infinite;opacity:.9}
.scene.spring .deco span,.scene.summer .deco span{top:auto;animation:floaty 4s ease-in-out infinite}
#kid{position:absolute;inset:8px 0 6px 0;display:flex;justify-content:center}
#kid svg{height:100%;width:auto;animation:breathe 3s ease-in-out infinite}
.scene .tag{position:absolute;left:12px;top:12px;background:#fff;border-radius:14px;padding:4px 12px;font-weight:800;font-size:1.1rem;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.wardrobe{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.ward{background:#fff;border-radius:18px;padding:6px 4px 6px;border:4px solid transparent;box-shadow:0 3px 0 #dde4f2;display:flex;flex-direction:column;align-items:center}
.ward svg{height:56px;width:100%}
.ward span{font-weight:800;font-size:1rem;line-height:1.05;color:var(--en)}
.ward small{font-size:.78rem;color:var(--muted);font-weight:700;line-height:1.1}
.ward.on{border-color:var(--accent);background:var(--soft)}
.ward.bad{border-color:#ff8787;animation:shake .5s 2}
.sentence{background:#fff9db;border:4px dashed #fcc419;border-radius:22px;padding:14px;font-size:clamp(1.4rem,5.5vw,1.9rem);font-weight:800;color:var(--en);display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.fbk{font-size:1.15rem;font-weight:700;text-align:center;margin-top:10px}

/* ---------- voice ---------- */
.voicecard{background:#fff;border-radius:28px;padding:16px;box-shadow:var(--shadow);text-align:center;max-width:640px;margin:0 auto}
.mic{width:128px;height:128px;border-radius:50%;background:#ff6b6b;color:#fff;font-size:3.6rem;box-shadow:0 7px 0 #e03131;margin:8px auto 4px;display:grid;place-items:center}
.mic.listening{background:#f03e3e;animation:ring 1.1s infinite}
.vfb{min-height:64px;font-size:1.2rem;font-weight:700;padding:8px;border-radius:18px;background:#f8f9ff;margin:10px 0}
.vcount{font-weight:800}

/* ---------- awards ---------- */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.acard{background:#fff;border-radius:24px;padding:14px;box-shadow:var(--shadow);text-align:center}
.acard .medal{font-size:4rem;animation:none}
.acard h3{font-size:1.5rem}
.acard p{font-weight:700;color:var(--muted)}
.totals{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:6px 0 16px}
.totals div{background:#fff;border-radius:20px;padding:10px 18px;font-weight:800;font-size:1.2rem;box-shadow:var(--shadow)}

/* ---------- toast & confetti ---------- */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;visibility:hidden;background:#26324a;color:#fff;padding:12px 18px;border-radius:16px;font-weight:700;z-index:200;transition:transform .3s,opacity .3s,visibility .3s;max-width:92vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
.confetti{position:fixed;top:-40px;z-index:150;pointer-events:none;font-size:28px;animation:fall linear forwards}

@keyframes fall{to{transform:translateY(112vh) rotate(560deg)}}
@keyframes drift{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(18px,230px) rotate(160deg)}100%{transform:translate(-10px,470px) rotate(330deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-18px) rotate(-8deg)}60%{transform:translateY(-6px) rotate(6deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes ring{0%{box-shadow:0 7px 0 #c92a2a,0 0 0 0 rgba(255,107,107,.55)}100%{box-shadow:0 7px 0 #c92a2a,0 0 0 26px rgba(255,107,107,0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media (min-width:820px){
  .season-grid{grid-template-columns:repeat(4,1fr)}
  .mgrid{grid-template-columns:repeat(4,1fr)}
  .bins{grid-template-columns:repeat(4,1fr)}
  .builder{grid-template-columns:1fr 1.05fr;align-items:start}
  .tab{font-size:1.1rem}
}
@media (max-width:420px){
  #app{padding:8px 12px 100px}
  .tab{font-size:.8rem}
  .home-actions{grid-template-columns:1fr}
  .owl{width:66px;flex-basis:66px}
  .bubble{font-size:1.02rem}
  .imgopts{gap:8px}
  .letter{width:66px;height:66px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* ---------------- Ilustraciones SVG de la ropa ----------------

const O = '#2b2d42';

const limb = (x1, y1, x2, y2, w, c) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${O}" stroke-width="${w + 6}" stroke-linecap="round"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;

const jacketDraw = (c, d) => longSleeves(c) +
  `<path d="M60,116 L86,113 L100,146 L114,113 L140,116 L142,236 L58,236 Z" fill="${c}" ${SW}/>` +

const GAR = {
  tshirt: { slot: 'top', box: [34, 106, 132, 132], draw: () => { const c = '#ef5350'; return limb(70, 128, 58, 156, 26, c) + limb(130, 128, 142, 156, 26, c) +

    return m(45, 57) + m(155, 143); } },

function garIcon(id) {
  const [x, y, w, h] = GAR[id].box, p = 7;
  return `<svg viewBox="${x - p} ${y - p} ${w + 2 * p} ${h + 2 * p}" aria-hidden="true">${GAR[id].draw()}</svg>`;
}

  const w = W[id];
  if (GAR[id]) return `<div class="art ${size}" role="img" aria-label="${esc(w.en)}">${garIcon(id)}</div>`;

/* ---------------- Personaje ---------------- */

}

const handsSVG = s => `<circle cx="45" cy="224" r="11" fill="${s}" ${SW}/><circle cx="155" cy="224" r="11" fill="${s}" ${SW}/>`;
function headSVG(g, skin) {

  s += `<circle cx="60" cy="78" r="9" fill="${skin}" ${SW}/><circle cx="140" cy="78" r="9" fill="${skin}" ${SW}/><circle cx="100" cy="72" r="40" fill="${skin}" ${SW}/>`;

const stripEmoji = t => String(t).replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu, '').trim();

  ok: 'speechSynthesis' in window, en: null, es: null, q: 0,
  init() {
    if (!this.ok) return;
    const load = () => {
      const vs = speechSynthesis.getVoices(); const lg = v => v.lang.replace('_', '-').toLowerCase();
      const find = (langs, prefix) => {
        for (const L of langs) { const c = vs.filter(v => lg(v) === L); if (c.length) return c.find(v => /google/i.test(v.name)) || c.find(v => v.localService) || c[0]; }

  const m = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) m[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    m[i][j] = Math.min(m[i - 1][j] + 1, m[i][j - 1] + 1, m[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return m[a.length][b.length];
}
const EXTRA = { 't shirt': ['tee shirt', 'tshirt', 'teeshirt'], 'flip flops': ['flip flop', 'flipflops'], 'sunglasses': ['sun glasses'], 'snowman': ['snow man'], 'hot days': ['hot day'] };

  const base = normTxt(en.replace(/-/g, ' '));

  [...vs].forEach(v => vs.add(v.endsWith('s') ? v.slice(0, -1) : v + 's'));
  for (const a of alts) {
    const t = normTxt(a); if (!t) continue; const tj = t.replace(/ /g, '');
    for (const v of vs) {

      if (tj === vj || (' ' + t + ' ').includes(' ' + v + ' ')) return true;

/* Arrastrar y soltar compatible con pantallas táctiles (Android) y ratón */
function enableDrag(el, { onDrop, onTap }) {
  el.addEventListener('pointerdown', e => {
    if (el.classList.contains('done') || (e.pointerType === 'mouse' && e.button !== 0)) return;
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY, rect = el.getBoundingClientRect(); let ghost = null, dragging = false;
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    const clearOver = keep => $$('.drop.over').forEach(d => d !== keep && d.classList.remove('over'));
    const move = ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!dragging && Math.hypot(dx, dy) > 8) {
        dragging = true; ghost = el.cloneNode(true); ghost.classList.add('ghost'); ghost.classList.remove('sel');
        Object.assign(ghost.style, { position: 'fixed', left: rect.left + 'px', top: rect.top + 'px', width: rect.width + 'px', height: rect.height + 'px', pointerEvents: 'none', zIndex: 300, margin: 0 });
        document.body.appendChild(ghost); el.classList.add('dragging');
      }
      if (dragging) {
        ghost.style.transform = `translate(${dx}px,${dy}px) scale(1.08) rotate(-3deg)`;
        const t = dropAt(ev.clientX, ev.clientY); clearOver(t); if (t) t.classList.add('over');
      }
    };
    const up = ev => {
      el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
      clearOver(null);
      if (dragging) { ghost.remove(); el.classList.remove('dragging'); if (ev.type === 'pointerup') { const t = dropAt(ev.clientX, ev.clientY); if (t) onDrop(t); } }
      if (dragging) { el._dragged = true; setTimeout(() => { el._dragged = false; }, 350); }
    };
    el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  });
  // un toque (o Enter con el teclado) llega como click normal; se ignora si acaba de arrastrarse
  if (onTap) el.addEventListener('click', () => { if (!el._dragged && !el.classList.contains('done')) onTap(); });
}

function paintProgress() {
  const p = $('#gprog'); if (!p || !G) return;

}
function nextRound() {

}
function win(detail) {
  if (!G || G.lock) return; G.lock = true;
  SFX.play('ok'); const p = pick(PRAISE); say(p.en, detail || p.es); confetti(10);

}
function lose(every = false, msg) {

}
function finishGame() {

function g2Round(i, st) {

    if (cell.classList.contains('matched') || G.lock) return;
    if (chip.dataset.id === cell.dataset.id) {
      chip.classList.add('done'); chip.style.visibility = 'hidden'; sel = null;

    <div class="btnrow"><button class="btn warm" data-go="quiz:${sid}">🚀 Start!</button><button class="btn ghost" data-go="final">🏆 Big Test (4 Seasons)</button></div></div>`;
}
function buildQuiz(sid) {
  const words = shuffle(uniqueByEn(seasonWords(sid))), clothes = shuffle(SEASONS[sid].clothes), enSet = seasonEnSet(sid);
  const types = ['meaning', 'listen', 'word', 'wear', 'meaning', 'listen', 'word', 'listen', 'wear', 'meaning'];
  const used = new Set(), qs = []; let wi = 0;
  for (const t of types) {
    if (t === 'wear') {
      const id = clothes.find(c => !used.has(c)) || clothes[0]; used.add(id);
      const others = uniqueByEn(shuffle(CLOTHES.filter(c => !W[c].seasons.includes(sid) && !enSet.has(W[c].en)))).slice(0, 2);
      qs.push({ t, id, opts: shuffle([id, ...others]) });
    } else {
      let id = words[wi % words.length], guard = 0;
      while (used.has(id) && guard++ < 40) id = words[++wi % words.length];
      wi++; used.add(id);
      qs.push({ t, id, opts: shuffle([id, ...distractors(id, sid, 2, t === 'meaning' ? 'es' : null)]) });
    }
  }
  return qs;
}
function startQuiz(sid) {
  setTheme(sid);
  const Q = { sid, qs: buildQuiz(sid), i: 0, score: 0, miss: false, missed: [], lock: false };
  app.innerHTML = `${topbar('🏆 ' + SEASONS[sid].en + ' · Test', 'season:' + sid + ':quiz')}${guideHTML()}<div class="qstars" id="qstars"></div><section id="stage"></section>`;
  const paintStars = () => $('#qstars').innerHTML = Q.qs.map((_, k) => `<i class="${k < Q.i && !Q.missed.includes(Q.qs[k].id) ? 'on' : ''}">⭐</i>`).join('');
  const S = SEASONS[sid];
  const show = () => {
    if (Q.i >= Q.qs.length) return finish();
    Q.miss = false; Q.lock = false; paintStars();
    const q = Q.qs[Q.i], w = W[q.id], st = $('#stage');
    const head = `<p class="qnum">Pregunta ${Q.i + 1} de ${Q.qs.length}</p>`;
    let html = '';
    if (q.t === 'meaning') {

    $('#qagain').onclick = () => startQuiz(sid);

/* ================= GRAN EVALUACIÓN: LAS 4 ESTACIONES Y LA ROPA ================= */
const FINAL_TYPES = {
  match: '🧩 Relaciona el dibujo con la palabra', spell: '🔤 Completa la palabra', meaning: '📖 Qué significa la palabra',
  listen: '🎧 Escuchar y reconocer', word: '✏️ Decir la palabra en inglés', season: '🗂️ Clasificar por estación', wear: '👕 Ropa para cada estación'
};
function buildFinal() {
  const all = shuffle(uniqueByEn(Object.keys(W))); let k = 0; const take = () => all[k++ % all.length];
  const seasonPool = sortItems(), wearSeasons = shuffle(ORDER); let si = 0, wi = 0;
  const types = shuffle(['match', 'match', 'match', 'match', 'spell', 'spell', 'spell', 'spell', 'meaning', 'meaning', 'meaning',
    'listen', 'listen', 'listen', 'word', 'word', 'season', 'season', 'wear', 'wear']);
  return types.map(t => {
    if (t === 'match') { const ids = []; while (ids.length < 4) { const x = take(); if (!ids.some(y => W[y].en === W[x].en)) ids.push(x); } return { t, ids }; }
    if (t === 'season') return { t, id: seasonPool[si++ % seasonPool.length] };
    if (t === 'wear') {
      const sid = wearSeasons[wi++ % 4], id = pick(SEASONS[sid].clothes), enSet = seasonEnSet(sid);
      const others = uniqueByEn(shuffle(CLOTHES.filter(c => !W[c].seasons.includes(sid) && !enSet.has(W[c].en)))).slice(0, 2);
      return { t, id, sid, opts: shuffle([id, ...others]) };
    }
    const id = take();
    if (t === 'spell') return { t, id };
    return { t, id, opts: shuffle([id, ...distractors(id, null, 2, t === 'meaning' ? 'es' : null)]) };
  });
}
function startFinal() {
  setTheme(null);
  const F = { qs: buildFinal(), i: 0, score: 0, missed: [], typeMiss: {}, lock: false };
  app.innerHTML = `${topbar('🏆 Big Test · 4 Seasons', 'home')}${guideHTML()}<div class="qstars" id="qstars"></div><section id="stage"></section>`;
  const paintStars = () => $('#qstars').innerHTML = F.qs.map((q, k) => `<i class="${k < F.i && !q.missed ? 'on' : ''}">⭐</i>`).join('');

    F.lock = true; if (!q.missed) F.score++; F.i++; paintStars(); SFX.play('ok');

  const wrong = (q, ids, msg) => {
    if (!q.missed) { q.missed = true; F.typeMiss[q.t] = (F.typeMiss[q.t] || 0) + 1; }
    ids.forEach(id => { if (!F.missed.includes(id)) F.missed.push(id); });

  const renderMatch = (q, st, head) => {

      <div class="mgrid">${shuffle(q.ids).map(id => `<div class="mcell drop" data-id="${id}">${art(id, 'md')}<div class="slot">?</div></div>`).join('')}</div>
      <div class="chips">${shuffle(q.ids).map(id => `<button class="chip" data-id="${id}">${W[id].en}</button>`).join('')}</div></div>`;
    say(null, 'Relaciona cada dibujo con su palabra en inglés.');
    const tryMatch = (chip, cell) => {
      if (F.lock || cell.classList.contains('matched')) return;
      if (chip.dataset.id === cell.dataset.id) {
        chip.classList.add('done'); chip.style.visibility = 'hidden'; sel = null;
        cell.classList.add('matched'); cell.classList.remove('drop'); $('.slot', cell).textContent = W[cell.dataset.id].en;
        TTS.speak(W[cell.dataset.id].en); left--;
        if (left === 0) correct(q, '¡Relacionaste todos los dibujos!'); else SFX.play('ok');
      } else { chip.classList.remove('shake'); void chip.offsetWidth; chip.classList.add('shake'); wrong(q, [chip.dataset.id], 'Esa palabra no va con ese dibujo. ¡Prueba otra vez! 💪'); }
    };
    $$('.chip', st).forEach(chip => enableDrag(chip, {
      onDrop: cell => tryMatch(chip, cell),

    }));
  };

  const renderSpell = (q, st, head) => {
    const word = W[q.id].en;
    const idxs = [...word].map((c, k) => /[a-z]/i.test(c) && k > 0 ? k : -1).filter(k => k >= 0);
    const n = idxs.length >= 6 ? 2 : 1, blanks = shuffle(idxs).slice(0, n).sort((a, b) => a - b); let b = 0;
    const paint = () => {
      const done = b >= blanks.length;
      let letters = '';
      if (!done) {
        const ans = word[blanks[b]].toLowerCase();
        const pool = (/[aeiou]/.test(ans) ? 'aeiou' : 'bcdfghklmnprstwy').split('').filter(c => c !== ans);
        letters = shuffle([ans, ...shuffle(pool).slice(0, 3)]).map(l => `<button class="letter" data-l="${l}">${l}</button>`).join('');
      }
      st.innerHTML = `<div class="qcard">${head}${art(q.id, 'lg')}<button class="snd big" data-say="${q.id}" aria-label="Escuchar" style="margin:4px auto">🔊</button>

        <p class="ask">${done ? `${word} = ${W[q.id].es}` : n > 1 ? `Faltan ${n} letras. ¿Cuál va en el cuadro que brilla?` : '¿Qué letra falta?'}</p><div class="letters">${letters}</div></div>`;
      $$('.letter', st).forEach(btn => btn.onclick = () => {

  };

  const renderSeasonQ = (q, st, head) => {

    st.innerHTML = `<div class="qcard">${head}${art(q.id, 'lg')}<div class="qword"><span class="en">${w.en}</span><button class="snd big" data-say="${q.id}" aria-label="Escuchar">🔊</button></div>

      <div class="bins">${ORDER.map(s => `<button class="bin ${s}" data-s="${s}"><span class="be">${SEASONS[s].emoji}</span><b class="en">${SEASONS[s].en}</b><small>${SEASONS[s].es}</small></button>`).join('')}</div></div>`;
    say(null, '¿En qué estación vemos o usamos esto?'); setTimeout(() => TTS.speak(w.en), 250);
    $$('.bin', st).forEach(btn => btn.onclick = () => {

      if (w.seasons.includes(s2)) { btn.classList.add('yes'); correct(q, `${w.en} → ${SEASONS[s2].en} ${SEASONS[s2].emoji}`, `${w.en}. ${SEASONS[s2].en}!`); }

    });
  };

  const renderChoice = (q, st, head) => {

        <p class="ask">¿Qué significa esta palabra?</p><div class="opts">${q.opts.map(o => `<button class="opt" data-o="${o}">${W[o].es}</button>`).join('')}</div>`;
      say(null, 'Lee y escucha la palabra. ¿Qué significa?'); setTimeout(() => TTS.speak(w.en), 250);
    } else if (q.t === 'listen') {
      html = `<p class="ask">🎧 Escucha y toca el dibujo correcto.</p><button class="listenbtn" id="lb">🔊<span>Listen</span></button>

      say(null, 'Escucha con atención 👂');
    } else if (q.t === 'word') {
      html = `${art(q.id, 'lg')}<p class="ask">¿Cómo se dice en inglés?</p><div class="opts">${q.opts.map(o => `<button class="opt enopt" data-o="${o}">${W[o].en}</button>`).join('')}</div>`;
      say(null, 'Mira el dibujo. ¿Cómo se dice en inglés?');
    } else {

        <div class="imgopts">${q.opts.map(o => `<button class="imgopt" data-o="${o}">${art(o, 'md')}<span class="lbl">${W[o].en}</span></button>`).join('')}</div>`;

    st.innerHTML = `<div class="qcard">${head}${html}</div>`;
    if (q.t === 'listen') { const play = () => TTS.speak(w.en); $('#lb', st).onclick = play; setTimeout(play, 300); }
    $$('[data-o]', st).forEach(btn => btn.onclick = () => {
      if (F.lock) return; const l = $('.lbl', btn);
      if (btn.dataset.o === q.id) { btn.classList.add('right'); if (l) l.textContent = w.en; correct(q, `${w.en} = ${w.es}`, w.en); }
      else { btn.classList.add('wrong'); btn.disabled = true; if (l) l.textContent = W[btn.dataset.o].en; wrong(q, [q.id]); }

    $('#vslow', box).onclick = () => TTS.speak(w.en, 'en', 0.5);
    $('#vnext', box).onclick = () => { REC.stop(); V.i++; SFX.play('click'); draw(); };
    if (!SRClass) { $('#vsaid', box).onclick = () => { count(); const p = pick(PRAISE); SFX.play('ok'); $('#vfb', box).innerHTML = `<b class="en">${p.en}</b> 🌟 ¡Gracias por practicar <b>${esc(w.en)}</b>!`; say(p.en, p.es); confetti(12); }; return; }
    $('#mic', box).onclick = () => listen(id);
  }
  function listen(id) {
    const mic = $('#mic', box), fb = $('#vfb', box);
    if (REC.active) { REC.stop(); return; }
    TTS.stop(); mic.classList.add('listening'); fb.innerHTML = '👂 Te estoy escuchando… ¡di la palabra!';
    let got = false;
    REC.start({
      onResult: alts => { got = true; mic.classList.remove('listening'); handle(id, heardWord(alts, W[id].en), alts[0]); },
      onError: err => { got = true; mic.classList.remove('listening'); if (fb.isConnected) fb.innerHTML = errMsg(err); },
      onEnd: () => { mic.classList.remove('listening'); if (!got && fb.isConnected) fb.innerHTML = 'No alcancé a escucharte 🙉. Toca 🎤 y habla un poquito más fuerte.'; }
    });
  }
  function handle(id, ok, heard) {
    const fb = $('#vfb', box); if (!fb) return; V.tries++;
    if (ok) {
      count(); const p = pick(PRAISE); SFX.play('ok'); confetti(14);
      fb.innerHTML = `<b class="en">${p.en}</b> 🌟 Te escuché decir “<b>${esc(heard)}</b>”. ¡Sigue practicando!`;
      say(p.en, p.es);
    } else {
      fb.innerHTML = heard ? `Escuché algo como “${esc(heard)}”. 😊 ¡Buen intento! Escucha otra vez 🔊 y repítelo despacito.` : '¡Buen intento! 😊 Escucha otra vez y repite.';
      if (V.tries >= 2) { count(); fb.innerHTML += '<br>🌈 ¡Gracias por practicar! Puedes intentarlo de nuevo o pasar a la siguiente palabra.'; }
      say(null, '¡Buen intento! Escucha otra vez y repite conmigo 💪');
    }
  }
  draw();
}

/* ================= LOGROS ================= */
function renderAwards() {
  setTheme(null);
  app.innerHTML = `${topbar('🏅 My awards', 'home')}${guideHTML()}
  <div class="totals"><div>⭐ ${totalStars()} estrellas</div><div>🏅 ${medalCount()} / 4 medallas</div><div>🎤 ${P.voice || 0} palabras dichas</div><div>🏆 Big Test: ${P.final ? P.final.best + '/20 ' + MEDALS[P.final.medal].e : 'pendiente'}</div></div>
  <div class="agrid">${ORDER.map(sid => { const q = P.quiz[sid], l = (P.learned[sid] || []).length, t = seasonWords(sid).length;
    return `<div class="acard"><div class="medal">${q ? MEDALS[q.medal].e : '<span class="nomedal">🏅</span>'}</div><h3 class="en">${SEASONS[sid].emoji} ${SEASONS[sid].en}</h3>
      <p>${q ? `Evaluación: ${q.best} / 10` : 'Evaluación: pendiente'}</p><p>Palabras vistas: ${l} / ${t}</p><p>Juegos: ${gameStars(sid)} / 18 ⭐</p>
      <div class="btnrow"><button class="btn" data-go="season:${sid}">Go to ${SEASONS[sid].en}</button></div></div>`; }).join('')}</div>
  <div class="foot"><button class="linkbtn" id="reset">🗑️ Reset progress</button></div>`;
  say(medalCount() === 4 ? 'You are a superstar!' : 'Great job!', medalCount() === 4 ? '¡Ganaste las cuatro medallas! 🏆' : 'Aquí están tus estrellas y medallas. ¡Sigue jugando para ganar más!');
  $('#reset').onclick = () => {
    if (confirm('¿Seguro que quieres borrar todo el progreso guardado en este dispositivo?')) {
      const keepSfx = P.sfx; try { localStorage.removeItem(KEY); } catch (e) {} P = loadP(); P.sfx = keepSfx; save(); renderAwards(); toast('Progreso borrado');
    }
  };
}

/* ================= GUÍA PARA ADULTOS ================= */
function openParents() {
  const v = TTS.ok ? `Inglés: <b>${TTS.en ? esc(TTS.en.name) + ' (' + esc(TTS.en.lang) + ')' : 'no encontrada'}</b> · Español: <b>${TTS.es ? esc(TTS.es.name) + ' (' + esc(TTS.es.lang) + ')' : 'no encontrada'}</b>` : 'Este navegador no tiene síntesis de voz.';
  openModal(`<div class="parents"><h2>ℹ️ Guía para papás y profes</h2>
    <h3>📚 Cómo se usa</h3><ol><li>Elige una estación en la pantalla de inicio.</li><li><b>Learn</b>: toca cada tarjeta para ver, escuchar y repetir la palabra.</li><li><b>Games</b>: 6 actividades con estrellas.</li><li><b>My voice</b>: el niño escucha y dice la palabra con el micrófono.</li><li><b>Test</b>: 10 preguntas, puntaje, medalla y temas para repasar.</li><li><b>Big Test</b> (en el inicio): 20 preguntas que mezclan las 4 estaciones y la ropa, con completar la palabra y relacionar dibujo y palabra.</li></ol>
    <h3>🔊 Audio</h3><ul><li>Sube el volumen del dispositivo.</li><li>Voces detectadas: ${v}</li><li>Si no suena en Android: Ajustes › Accesibilidad › Texto a voz › Motor de Google, y descarga los idiomas inglés (EE. UU.) y español.</li></ul>
    <h3>🎤 Micrófono</h3><ul><li>Funciona en Google Chrome (Android o computador) con internet.</li><li>La primera vez el navegador pide permiso para usar el micrófono: acéptalo.</li><li>${SRClass ? '✅ Este navegador sí tiene reconocimiento de voz.' : '⚠️ Este navegador no tiene reconocimiento de voz; el niño puede practicar en voz alta y tocar ✅.'}</li><li>El reconocimiento es solo una ayuda: nunca califica la pronunciación como incorrecta.</li></ul>
    <h3>💾 Progreso</h3><ul><li>Se guarda solo en este dispositivo y navegador. No hay cuentas ni publicidad.</li><li>Puedes borrarlo en <b>My awards</b>.</li></ul>
    <div class="btnrow"><button class="btn" data-close>OK, got it!</button></div></div>`);
}

/* ---------------- Inicio ---------------- */
route(location.hash.slice(1) || 'home');
</script>
